
name: Improved CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: Python ${{ matrix.python-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5

        with:
          python-version: ${{ matrix.python-version }}

      - name: Install hash-verified CI dependencies
        run:  python -m pip install --no-cache-dir --require-hashes -r requirements-ci.lock

      - name: Install SoupGuard
        run: python -m pip install --no-deps -e .

      - name: Run tests
        run: python -m pytest -v

  build:
    name: Build Python distributions
    runs-on: ubuntu-latest
    needs: compatibility

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install hash-verified CI dependencies
        run:  python -m pip install --no-cache-dir --require-hashes -r requirements-ci.lock

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  artifact-data-check:
    name: Verify packaged banner data
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist/

      - name: Install built wheel into isolated target
        run: python -m pip install --no-deps --target installed dist/*.whl

      - name: Check banner in installed wheel
        run: |
          python -c "import sys; sys.path.insert(0, 'installed'); from saupgard.banner import get_banner; print(get_banner())"

  cli-entrypoint-check:
    name: Verify installed CLI
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist/

      - name: Install built wheel
        run: python -m pip install --no-deps dist/*.whl

      - name: Execute installed CLI
        run: saupgard --version
