
name: Secure TestPyPI Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned CI dependencies
        run: python -m pip install --require-hashes -r requirements-ci.lock

      - name: Install SoupGuard
        run: python -m pip install --no-deps -e .

      - name: Run tests
        run: python -m pytest -v

  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Validate tag matches package version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")

          echo "Git tag version: $TAG_VERSION"
          echo "Package version: $PACKAGE_VERSION"

          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Error: Git tag and package version do not match."
            exit 1
          fi

      - name: Install pinned build tools
        run: python -m pip install --require-hashes -r requirements-ci.lock

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Generate signed artifact provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  verify-artifacts:
    name: Verify and test built artifacts
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      attestations: read

    steps:
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-distributions
          path: dist/

      - name: Verify signed provenance for release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for file in dist/*; do
            echo "Verifying provenance for: $file"

            gh attestation verify "$file" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          done

      - name: Test wheel in a clean environment
        run: |
          python -m venv .venv-wheel
          .venv-wheel/bin/python -m pip install --no-deps dist/*.whl
          .venv-wheel/bin/python -c "from saupgard.banner import get_banner; print(get_banner())"
          .venv-wheel/bin/saupgard --version

      - name: Test source distribution in a clean environment
        run: |
          python -m venv .venv-sdist
          .venv-sdist/bin/python -m pip install --no-deps dist/*.tar.gz
          .venv-sdist/bin/python -c "from saupgard.banner import get_banner; print(get_banner())"
          .venv-sdist/bin/saupgard --version

  publish:
    name: Publish to TestPyPI using OIDC
    runs-on: ubuntu-latest
    needs: verify-artifacts

    environment:
      name: testpypi
      url: https://test.pypi.org/p/saupgard

    permissions:
      id-token: write
      contents: read
      attestations: read

    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-distributions
          path: dist/

      - name: Verify provenance of artifacts before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for file in dist/*; do
            echo "Final verification: $file"

            gh attestation verify "$file" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          done

      - name: Publish package to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          print-hash: true
